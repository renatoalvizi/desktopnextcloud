<VirtualHost *:80>
    ServerName updates.edalvix.cloud
    DocumentRoot /srv/app/public
    ServerSignature Off

    PassEnv EDALVIX_RELEASES_FILE

    # Update check: /client/ and /client/index.php
    Alias /client /srv/app/public
    <Directory /srv/app/public>
        Require all granted
        Options -Indexes
        DirectoryIndex index.php
    </Directory>

    # Installers
    Alias /download /srv/downloads
    <Directory /srv/downloads>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    RedirectMatch 302 ^/$ https://edalvix.com.br/cloud/download
</VirtualHost>
